    <path d="M50 128V76C50 62 61 51 75 51H84V44C84 36 91 29 99 29H119C136 29 151 36 163 48C179 64 188 84 188 106C188 147 156 179 115 179H99V163C99 155 106 148 114 148H115C131 148 145 134 145 118C145 102 132 89 115 89H99V128C99 136 92 143 84 143H66C57 143 50 136 50 128Z" fill="#20D88A"/>
    <rect x="30" y="94" width="18" height="40" rx="9" fill="#20D88A"/>
  </g>

  <text x="270" y="135" fill="url(#wordmark)" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="-3">Pattufy</text>
  <text x="274" y="180" fill="#AAB4CE" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="5">YOUR SOUND. YOUR WORLD.</text>

