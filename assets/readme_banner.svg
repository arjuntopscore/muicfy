<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B14"/>
      <stop offset="0.55" stop-color="#10182A"/>
      <stop offset="1" stop-color="#101229"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="420" y1="80" x2="760" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9C5FF"/>
    </linearGradient>
    <linearGradient id="bars" x1="850" y1="80" x2="1060" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29F09B"/>
      <stop offset="1" stop-color="#7C8FFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="35" r="150" fill="#6978FF" opacity="0.07"/>
  <circle cx="170" cy="275" r="190" fill="#29F09B" opacity="0.05"/>

  <g transform="translate(78 56)">
